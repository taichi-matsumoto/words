<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TODO</title>
<style>
  :root {
    --bg: #f6f5f2;
    --surface: #ffffff;
    --text: #23231f;
    --muted: #8a877f;
    --line: #e7e4dd;
    --accent: #3d6b5a;
    --accent-soft: #e4eee9;
    --danger: #b4483c;
    --shadow: 0 1px 2px rgba(30, 28, 20, .04), 0 8px 24px rgba(30, 28, 20, .05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171816;
      --surface: #212320;
      --text: #e8e6e0;
      --muted: #8f8c84;
      --line: #32352f;
      --accent: #7fb39d;
      --accent-soft: #283530;
      --danger: #e07a6e;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 56px 16px 80px;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
  }
  h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: .02em;
  }
  .summary { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
  }

  form.add {
    display: flex;
    align-items: center;
    padding: 6px 6px 6px 16px;
    margin-bottom: 28px;
  }
  form.add input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    padding: 10px 0;
  }
  form.add input::placeholder { color: var(--muted); }
  form.add button {
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: var(--surface);
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 8px 16px;
    cursor: pointer;
  }
  form.add button:disabled { opacity: .35; cursor: default; }
  form.add:focus-within { border-color: var(--accent); }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 0 4px 8px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .06em;
  }
  .section-head button {
    border: 0;
    background: none;
    color: var(--muted);
    font: inherit;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
  }
  .section-head button:hover { color: var(--text); }
  .toggle-done::before {
    content: "";
    display: inline-block;
    width: 6px; height: 6px;
    margin-right: 8px;
    border-right: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor;
    transform: translateY(-2px) rotate(45deg);
    transition: transform .15s;
  }
  .collapsed .toggle-done::before { transform: translateY(0) rotate(-45deg); }

  ul { list-style: none; margin: 0 0 28px; padding: 0; }
  ul.card:empty { display: none; }

  li {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 12px 12px 16px;
    border-top: 1px solid var(--line);
  }
  li:first-child { border-top: 0; }
  li:hover .del, li:focus-within .del { opacity: 1; }

  .check {
    appearance: none;
    flex: none;
    width: 18px; height: 18px;
    margin: 3px 0 0;
    border: 1.5px solid var(--muted);
    border-radius: 50%;
    cursor: pointer;
    display: grid;
    place-content: center;
    transition: background .15s, border-color .15s;
  }
  .check:hover { border-color: var(--accent); }
  .check:checked { background: var(--accent); border-color: var(--accent); }
  .check:checked::after {
    content: "";
    width: 4px; height: 8px;
    border-right: 2px solid var(--surface);
    border-bottom: 2px solid var(--surface);
    transform: translateY(-1px) rotate(45deg);
  }
  .check:focus-visible, .del:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .text {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    cursor: text;
  }
  .text[contenteditable="true"] {
    outline: 0;
    background: var(--accent-soft);
    border-radius: 4px;
    margin: -2px -6px;
    padding: 2px 6px;
  }
  .done .text { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }

  .del {
    flex: none;
    opacity: 0;
    border: 0;
    background: none;
    color: var(--muted);
    width: 26px; height: 26px;
    margin: -1px -4px 0 0;
    border-radius: 6px;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    transition: opacity .15s, color .15s, background .15s;
  }
  .del:hover { color: var(--danger); background: var(--accent-soft); }
  @media (hover: none) { .del { opacity: .6; } }

  .collapsed + #doneList { display: none; }

  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 40px 0 20px;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translate(-50%, 16px);
    opacity: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 12px 10px 18px;
    background: var(--text);
    color: var(--bg);
    border-radius: 10px;
    font-size: 14px;
    box-shadow: var(--shadow);
    transition: opacity .2s, transform .2s;
    max-width: calc(100vw - 32px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button {
    border: 0;
    background: none;
    color: var(--accent-soft);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
  }

  .warn {
    margin-bottom: 20px;
    padding: 10px 14px;
    border-radius: 8px;
    background: var(--accent-soft);
    color: var(--danger);
    font-size: 13px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>TODO</h1>
    <span class="summary" id="summary"></span>
  </header>

  <div class="warn" id="warn" hidden>このブラウザでは保存が使えないようです。ページを閉じると内容は消えます。</div>

  <form class="add card" id="addForm" autocomplete="off">
    <input id="newText" type="text" placeholder="やることを入力して Enter" aria-label="新しいTODO" maxlength="500">
    <button type="submit" id="addBtn" disabled>追加</button>
  </form>

  <ul class="card" id="activeList" aria-label="未完了"></ul>
  <p class="empty" id="empty" hidden>やることはありません。</p>

  <div id="doneSection" hidden>
    <div class="section-head" id="doneHead">
      <button type="button" class="toggle-done" id="toggleDone" aria-expanded="true">完了 <span id="doneCount"></span></button>
      <button type="button" id="clearDone">完了したものをすべて削除</button>
    </div>
    <ul class="card" id="doneList" aria-label="完了"></ul>
  </div>
</div>

<div class="toast" id="toast" role="status">
  <span id="toastMsg"></span>
  <button type="button" id="undoBtn">元に戻す</button>
</div>

<script>
(() => {
  const KEY = "todo.items.v1";
  const UI_KEY = "todo.ui.v1";

  const $ = (id) => document.getElementById(id);
  const els = {
    form: $("addForm"), input: $("newText"), addBtn: $("addBtn"),
    active: $("activeList"), done: $("doneList"), empty: $("empty"),
    doneSection: $("doneSection"), doneHead: $("doneHead"), doneCount: $("doneCount"),
    toggleDone: $("toggleDone"), clearDone: $("clearDone"),
    summary: $("summary"), toast: $("toast"), toastMsg: $("toastMsg"), undoBtn: $("undoBtn"),
    warn: $("warn"),
  };

  // --- 保存まわり -------------------------------------------------------
  let storageOk = true;

  function load(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch {
      storageOk = false;
      return fallback;
    }
  }
  function save(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch {
      storageOk = false;
    }
    els.warn.hidden = storageOk;
  }

  let items = load(KEY, []);
  if (!Array.isArray(items)) items = [];
  const ui = Object.assign({ doneCollapsed: false }, load(UI_KEY, {}));

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const persist = () => save(KEY, items);

  // --- 描画 -------------------------------------------------------------
  function row(item) {
    const li = document.createElement("li");
    li.dataset.id = item.id;
    if (item.done) li.className = "done";

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.className = "check";
    cb.checked = item.done;
    cb.setAttribute("aria-label", "完了にする");

    const text = document.createElement("span");
    text.className = "text";
    text.textContent = item.text;
    text.title = "ダブルクリックで編集";

    const del = document.createElement("button");
    del.type = "button";
    del.className = "del";
    del.textContent = "×";
    del.setAttribute("aria-label", "削除");

    li.append(cb, text, del);
    return li;
  }

  function render() {
    // 未完了は新しい順、完了は完了した順（新しいものが上）
    const active = items.filter((t) => !t.done).sort((a, b) => b.createdAt - a.createdAt);
    const done = items.filter((t) => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));

    els.active.replaceChildren(...active.map(row));
    els.done.replaceChildren(...done.map(row));

    els.empty.hidden = active.length > 0;
    els.empty.textContent = items.length ? "すべて完了しました。" : "やることはありません。";
    els.doneSection.hidden = done.length === 0;
    els.doneCount.textContent = done.length;
    els.doneHead.classList.toggle("collapsed", ui.doneCollapsed);
    els.toggleDone.setAttribute("aria-expanded", String(!ui.doneCollapsed));

    els.summary.textContent = items.length ? `残り ${active.length} / ${items.length}` : "";
    els.warn.hidden = storageOk;
  }

  const find = (id) => items.find((t) => t.id === id);

  // --- 追加 -------------------------------------------------------------
  els.input.addEventListener("input", () => {
    els.addBtn.disabled = !els.input.value.trim();
  });
  els.form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = els.input.value.trim();
    if (!text) return;
    items.push({ id: uid(), text, done: false, createdAt: Date.now(), doneAt: null });
    persist();
    els.input.value = "";
    els.addBtn.disabled = true;
    render();
    els.input.focus();
  });
  // 日本語入力の変換確定の Enter で送信されないように
  els.input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.isComposing || e.keyCode === 229)) e.preventDefault();
  });

  // --- チェック・削除・編集（リストに委譲） --------------------------------
  function onListChange(e) {
    if (!e.target.classList.contains("check")) return;
    const item = find(e.target.closest("li").dataset.id);
    if (!item) return;
    item.done = e.target.checked;
    item.doneAt = item.done ? Date.now() : null;
    persist();
    render();
  }

  function onListClick(e) {
    const btn = e.target.closest(".del");
    if (!btn) return;
    const id = btn.closest("li").dataset.id;
    const index = items.findIndex((t) => t.id === id);
    if (index < 0) return;
    const [removed] = items.splice(index, 1);
    persist();
    render();
    offerUndo("1件削除しました", () => {
      items.splice(Math.min(index, items.length), 0, removed);
    });
  }

  function onListDblClick(e) {
    const text = e.target.closest(".text");
    if (!text || text.isContentEditable) return;
    const item = find(text.closest("li").dataset.id);
    if (!item) return;
    startEdit(text, item);
  }

  function startEdit(el, item) {
    el.contentEditable = "true";
    el.focus();
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(range);

    let finished = false;
    const finish = (commit) => {
      if (finished) return;
      finished = true;
      el.contentEditable = "false";
      const value = el.textContent.replace(/\s+/g, " ").trim();
      if (commit && value && value !== item.text) {
        item.text = value;
        persist();
      }
      render();
    };
    el.addEventListener("keydown", (e) => {
      if (e.isComposing || e.keyCode === 229) return;
      if (e.key === "Enter") { e.preventDefault(); finish(true); }
      if (e.key === "Escape") { e.preventDefault(); finish(false); }
    });
    el.addEventListener("blur", () => finish(true), { once: true });
    // 書式付きの貼り付けを素のテキストに
    el.addEventListener("paste", (e) => {
      e.preventDefault();
      document.execCommand("insertText", false, e.clipboardData.getData("text/plain"));
    });
  }

  for (const list of [els.active, els.done]) {
    list.addEventListener("change", onListChange);
    list.addEventListener("click", onListClick);
    list.addEventListener("dblclick", onListDblClick);
  }

  // --- 完了セクション -------------------------------------------------------
  els.toggleDone.addEventListener("click", () => {
    ui.doneCollapsed = !ui.doneCollapsed;
    save(UI_KEY, ui);
    render();
  });

  els.clearDone.addEventListener("click", () => {
    const snapshot = items.slice();
    const count = items.filter((t) => t.done).length;
    if (!count) return;
    items = items.filter((t) => !t.done);
    persist();
    render();
    offerUndo(`完了した ${count} 件を削除しました`, () => { items = snapshot; });
  });

  // --- 元に戻す ------------------------------------------------------------
  let undoFn = null;
  let toastTimer = null;

  function offerUndo(message, fn) {
    undoFn = fn;
    els.toastMsg.textContent = message;
    els.toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 6000);
  }
  function hideToast() {
    els.toast.classList.remove("show");
    undoFn = null;
  }
  els.undoBtn.addEventListener("click", () => {
    if (!undoFn) return;
    undoFn();
    persist();
    render();
    hideToast();
  });

  // --- 別タブでの変更を反映 ---------------------------------------------------
  window.addEventListener("storage", (e) => {
    if (e.key !== KEY) return;
    if (document.activeElement && document.activeElement.isContentEditable) return;
    items = load(KEY, []);
    if (!Array.isArray(items)) items = [];
    render();
  });

  render();
  els.input.focus();
})();
</script>
</body>
</html>
